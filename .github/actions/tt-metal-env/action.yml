name: tt-metal environment
description: tt-metal source, the Python dependencies the image lacks, and the paths every device job needs.

inputs:
  ref:
    description: tt-metal ref to check out; empty takes the default branch
    default: ""
  fetch-depth:
    description: 1 to read `models`, 0 when the job will build a commit it names
    default: "1"
  submodules:
    description: recursive when the job will build
    default: "false"

runs:
  using: composite
  steps:
    # The image ships a compiled ttnn, but `models` resolves onto the source tree and
    # metrics.py imports tt-metal's own ULP from it rather than reimplementing it.
    - uses: actions/checkout@v4
      with:
        repository: tenstorrent/tt-metal
        ref: ${{ inputs.ref }}
        path: tt-metal
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: ${{ inputs.submodules }}

    - shell: bash
      run: |
        # The workspace belongs to the runner user and the container runs as root.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/tt-metal"
        echo "TT_METAL_HOME=$GITHUB_WORKSPACE/tt-metal" >> "$GITHUB_ENV"
        echo "TT_METAL_CACHE=$RUNNER_TEMP/kernel-cache" >> "$GITHUB_ENV"
        echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
        echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tt-metal" >> "$GITHUB_ENV"
        # uv, never pip: the image's /opt/venv is built by `uv venv` and ships no pip, so
        # a bare pip is some other interpreter and installs where python3 cannot see it.
        # uv is copied in a builder stage, so it may not survive into every image.
        command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"        # this step
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"   # and every step after it
        # `--python` targets the interpreter that will import, whatever the layout is.
        # torch is pinned to tt-metal's own version so the fp64 golden cannot drift from
        # the one the report was measured against; the image ships ttnn, not torch.
        uv pip install --quiet --python "$(command -v python3)" \
          torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        # The project itself, so pyproject declares its dependencies once instead of here.
        # pytest and typing_extensions are tt-metal's: utility_functions imports both at
        # module scope, so importing its ULP drags them in and the image ships neither.
        uv pip install --quiet --python "$(command -v python3)" \
          -e "$GITHUB_WORKSPACE" pytest typing-extensions

    - shell: bash
      # Every stage module, because cli.py imports them lazily per subcommand: a missing
      # dependency must fail here, not six hours into a sweep that already took the device.
      run: |
        PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tt-metal" python3 -c "
        import sys, ttnn, torch, pathlib
        from models.common.utility_functions import ulp
        import ttnn_accuracy.ops.manifest, ttnn_accuracy.measure.runner, ttnn_accuracy.measure.perf
        import ttnn_accuracy.report.charts, ttnn_accuracy.report.pages, ttnn_accuracy.report.compare
        print('python', sys.executable)
        print('ttnn  ', pathlib.Path(ttnn.__file__).parent)
        print('torch ', torch.__version__)"
