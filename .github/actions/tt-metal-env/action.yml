name: tt-metal environment
description: tt-metal source, the Python dependencies the image lacks, and the paths every device job needs.

inputs:
  ref:
    description: tt-metal ref to check out; empty takes the default branch
    default: ""
  builds:
    description: true when the job builds tt-metal itself, in the ci-build image
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: tenstorrent/tt-metal
        ref: ${{ inputs.ref }}
        path: tt-metal
        fetch-depth: ${{ inputs.builds == 'true' && '0' || '1' }}
        submodules: ${{ inputs.builds == 'true' && 'recursive' || 'false' }}

    - shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/tt-metal"
        echo "TT_METAL_HOME=$GITHUB_WORKSPACE/tt-metal" >> "$GITHUB_ENV"
        echo "TT_METAL_CACHE=$RUNNER_TEMP/kernel-cache" >> "$GITHUB_ENV"
        echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
        python_path="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tt-metal"
        if [ "${{ inputs.builds }}" = true ]; then
          python_path="$python_path:$GITHUB_WORKSPACE/tt-metal/ttnn"
        fi
        echo "PYTHONPATH=$python_path" >> "$GITHUB_ENV"
        command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        uv pip install --quiet --python "$(command -v python3)" \
          torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        uv pip install --quiet --python "$(command -v python3)" \
          -e "$GITHUB_WORKSPACE" pytest typing-extensions

    - shell: bash
      run: python3 -c "import sys, torch; print(sys.executable, torch.__version__)"

    - if: inputs.builds != 'true'
      shell: bash
      run: |
        python3 -c "
        import pathlib, ttnn
        import models.common.utility_functions as golden
        import ttnn_accuracy.ops.manifest, ttnn_accuracy.measure.runner
        import ttnn_accuracy.measure.perf, ttnn_accuracy.report.charts
        import ttnn_accuracy.report.pages, ttnn_accuracy.report.compare
        print('ttnn  ', pathlib.Path(ttnn.__file__).parent)
        print('golden', pathlib.Path(golden.__file__).parent)
        ttnn.close_device(ttnn.open_device(device_id=0))
        print('device open/close ok')"
