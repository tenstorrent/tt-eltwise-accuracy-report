name: accuracy-command

# Names the run after the pull request it is measuring, so the Actions list is readable and
# a caller can tell its own run from someone else's.
run-name: accuracy-report for tt-metal#${{ inputs.pr || github.event.issue.number }}

# Comment `/accuracy-report tt-metal#12345` on any issue or pull request here. The command
# reads that tt-metal PR's changed files, works out which ops they can affect, and measures
# only those against the published baseline. Selecting nothing is a valid, expected answer.
#
# It lives in this repository rather than in tt-metal on purpose: a comment there could only
# start a workflow there, which would need a token with write access to this repository held
# as a tt-metal secret. Nothing here needs anyone else's permission.
on:
  issue_comment:
    types: [created]
  # Driven from tt-metal. A comment there can only start a workflow there, so a small
  # workflow in that repository checks the commenter and dispatches this one. Results stay
  # on this run's page, which is why nothing here ever needs write access to tt-metal.
  workflow_dispatch:
    inputs:
      pr:
        description: tt-metal pull request number
        required: true
      ops:
        description: measure these instead of what the change selects
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  select:
    if: github.event_name == 'workflow_dispatch'
      || startsWith(github.event.comment.body, '/accuracy-report')
    runs-on: ubuntu-latest
    outputs:
      ops: ${{ steps.pick.outputs.ops }}
      arches: ${{ steps.pick.outputs.arches }}
      sha: ${{ steps.pr.outputs.sha }}
      pr: ${{ steps.pr.outputs.number }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    # One in flight per thread. `issue_comment` always reports `github.ref` as the default
    # branch, so the default group would collapse every thread into a single slot.
    concurrency:
      group: accuracy-command-${{ github.event.issue.number || inputs.pr }}
    steps:
      # Measuring occupies a device the whole team shares, so this is the authorization
      # control, not a formality. Anyone with write could already dispatch it by hand.
      # A dispatch is already gated: only someone with write here can start one, and the
      # tt-metal side checks its own commenter before it dispatches.
      - name: Refuse anyone without write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          level=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
            --jq .permission 2>/dev/null || echo none)
          case "$level" in
            admin|maintain|write) echo "$ACTOR may run this" ;;
            *) echo "::error::$ACTOR has $level access; /accuracy-report needs write"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Read the tt-metal pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Attacker-controlled text: passed through the environment, never interpolated
          # into the script, and matched against a fixed shape rather than parsed loosely.
          BODY: ${{ github.event.comment.body }}
          DISPATCHED: ${{ inputs.pr }}
        run: |
          number=${DISPATCHED:-$(grep -oE 'tt-metal#[0-9]+' <<<"$BODY" | head -1 | cut -d'#' -f2 || true)}
          [ -n "$number" ] || {
            echo "::error::name the pull request, e.g. /accuracy-report tt-metal#12345"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr view "$number" --repo tenstorrent/tt-metal --json headRefOid,title \
            --jq '"sha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"
          # REST, not `gh pr view --json files`: that returns only the first 100 with no
          # error, and the paths it drops are invisible to the selector.
          gh api --paginate "repos/tenstorrent/tt-metal/pulls/$number/files" \
            --jq '.[].filename' > changed.txt
          echo "$(wc -l < changed.txt) changed files in tt-metal#$number"

      - name: Work out which ops it can affect
        id: pick
        env:
          BODY: ${{ github.event.comment.body }}
          DISPATCHED_OPS: ${{ inputs.ops }}
        run: |
          # The only dependency the selector has left: reading the manifest reaches neither
          # torch nor ttnn, so this job stays a minute on a stock runner.
          python3 -m pip install --quiet loguru
          PYTHONPATH=src python3 -m ttnn_accuracy.cli select changed.txt > selection.json
          cat selection.json
          # An explicit `ops=` overrides the selector, for the cases it misses.
          override=${DISPATCHED_OPS:-$(grep -oE 'ops=[A-Za-z0-9_,]+' <<<"$BODY" | head -1 | cut -d= -f2 || true)}
          ops=${override:-$(jq -r '.ops | join(",")' selection.json)}
          arches=$(jq -c '.arches' selection.json)
          [ "$arches" != "[]" ] || arches='["wh"]'
          {
            echo "ops=$ops"
            echo "arches=$arches"
          } >> "$GITHUB_OUTPUT"

      - name: Say what was selected
        env:
          GH_TOKEN: ${{ github.token }}
          OPS: ${{ steps.pick.outputs.ops }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ -z "$OPS" ]; then
              echo "**No eltwise op is affected by that change.** Nothing to measure."
            else
              echo "Measuring \`$OPS\` on $(jq -r '.arches|join(", ")' selection.json)."
              echo
              echo "| Op | Because |"
              echo "|---|---|"
              jq -r '.reasons | to_entries[] | "| `\(.key)` | `\(.value)` |"' selection.json
            fi
            if [ "$(jq -r '.unresolved|length' selection.json)" != 0 ]; then
              echo
              echo "_Headers naming no op, so the wider categories may be worth a manual run:_"
              jq -r '.unresolved[] | "- `\(.)`"' selection.json
            fi
            echo
            echo "[Run]($RUN)"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # Only a comment in this repository has a thread to answer. A dispatch from
          # tt-metal reads the same text on the run page its own comment already links to.
          if [ "${{ github.event_name }}" = issue_comment ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  measure:
    needs: select
    if: needs.select.outputs.ops != ''
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.select.outputs.arches) }}
      fail-fast: false
    uses: ./.github/workflows/validate-kernel.yml
    with:
      commit: ${{ needs.select.outputs.sha }}
      ops: ${{ needs.select.outputs.ops }}
      arch: ${{ matrix.arch }}

  # The answer, on the pull request that asked. Posting there needs write on tt-metal, which
  # is why this is the one step holding a token for it; without that secret the run still
  # measures and still reports on its own page, and only this job is skipped.
  report:
    # Not gated on `ops`: affecting nothing is an answer, and silence after "measuring" is not.
    needs: [select, measure]
    if: always() && needs.select.outputs.pr != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: validate-*-${{ github.run_id }}
          merge-multiple: true

      - name: Write the answer
        env:
          PR: ${{ needs.select.outputs.pr }}
          OPS: ${{ needs.select.outputs.ops }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ needs.measure.result }}
        run: |
          {
            if [ -z "$OPS" ]; then
              echo "### Eltwise accuracy"
              echo
              echo "No eltwise op is affected by this change. Nothing measured."
            else
              echo "### Eltwise accuracy — \`$OPS\`"
              echo
              case "$OUTCOME" in
                success) echo "Nothing moved against the published baseline." ;;
                failure) echo "Something moved. The blocks below are the diff per architecture." ;;
                *)       echo "The run did not finish ($OUTCOME)." ;;
              esac
              echo
              cat result-*.md 2>/dev/null || true
            fi
            echo
            echo "[Full log and charts]($RUN) · informational, this does not gate the pull request."
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      # Always back to whoever asked. A comment here needs no secret, so this is the whole
      # answer until a tt-metal token exists.
      - name: Answer the thread that asked
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file body.md

      # And on the tt-metal pull request itself. Delivery, not measurement: the answer is
      # already written and uploaded, so a token problem is a warning on a green run rather
      # than a red one that implies the ops were never measured.
      - name: Answer the tt-metal pull request
        env:
          GH_TOKEN: ${{ secrets.TT_METAL_COMMENT_TOKEN }}
          PR: ${{ needs.select.outputs.pr }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::no TT_METAL_COMMENT_TOKEN — the answer is on this run page"; exit 0
          fi
          if gh pr comment "$PR" --repo tenstorrent/tt-metal --body-file body.md; then exit 0; fi
          # A conversation comment is an issue comment, so `addComment` is refused for a
          # token holding only Pull requests write. Naming the scope saves reading the log.
          echo "::warning::TT_METAL_COMMENT_TOKEN cannot comment on tt-metal#$PR —" \
               "it needs Issues: read and write, not Pull requests"

      # Kept whichever way the comment went, so a caller can collect the answer itself.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-summary
          path: body.md
          retention-days: 14
