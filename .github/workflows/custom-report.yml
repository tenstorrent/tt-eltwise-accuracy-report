name: custom-report

on:
  workflow_dispatch:
    inputs:
      ops:
        description: ops to measure, comma separated (e.g. relu_max,leaky_relu)
        required: true
      params:
        description: values to measure them at (e.g. relu_max=6,leaky_relu=0.2)
        required: false
      arch:
        type: choice
        options: [wh, bh]
        default: wh
      dtype:
        type: choice
        options: [bf16, fp32, both]
        default: bf16

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tt.outputs.version }}
    steps:
      - id: tt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo tenstorrent/tt-metal --json tagName --jq .tagName)
          [ -n "$version" ] || { echo "no tt-metal release resolved"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  measure:
    needs: resolve
    runs-on: ${{ inputs.arch == 'wh' && 'tt-ubuntu-2204-n300-stable' || 'tt-ubuntu-2204-p150b-stable' }}
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:${{ needs.resolve.outputs.version }}
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tt-metal-env
        with:
          ref: ${{ needs.resolve.outputs.version }}

      - name: Measure at the requested parameters
        env:
          OPS: ${{ inputs.ops }}
          PARAMS: ${{ inputs.params }}
          ARCH: ${{ inputs.arch }}
          DTYPE: ${{ inputs.dtype }}
        run: |
          status=0
          python3 -m ttnn_accuracy.cli measure --arch "$ARCH" --ops "$OPS" --dtype "$DTYPE" \
            ${PARAMS:+--params "$PARAMS"} || status=$?
          if [ "$status" -ge 128 ]; then
            echo "::error::measure died with signal $((status - 128))"
            exit 1
          fi
          [ "$status" -eq 0 ] || echo "::warning::$status variant(s) produced no data"
          python3 -m ttnn_accuracy.cli charts
          python3 -m ttnn_accuracy.cli report \
            --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw

      - name: Put the measurements on the run page
        if: always()
        env:
          OPS: ${{ inputs.ops }}
          PARAMS: ${{ inputs.params }}
          ARCH: ${{ inputs.arch }}
          DTYPE: ${{ inputs.dtype }}
        run: |
          [ "$DTYPE" = both ] && dtypes="bf16 fp32" || dtypes="$DTYPE"
          {
            echo "## \`$OPS\` on $ARCH at \`${PARAMS:-defaults}\`"
            echo
            for op in ${OPS//,/ }; do
              for d in $dtypes; do
                page="reports/by_arch/$ARCH/$d/$op.md"
                [ -f "$page" ] || { echo "No page for $ARCH/$d/$op."; echo; continue; }
                sed '/^_Measured on/q' "$page" |
                  grep -v '^\[← \|^_This page is auto-generated\|^---$' |
                  sed 's/^# /### /'
                echo
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-report-${{ inputs.arch }}-${{ github.run_id }}
          path: |
            reports/
            report_index.json
          retention-days: 14

      - name: Leave the checkout clean
        if: always()
        run: |
          git checkout -- reports/ report_index.json analyze-report/ask.md
          git checkout --detach 2>/dev/null || true
