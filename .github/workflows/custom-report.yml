# A report for parameters someone wants to try, without touching the published one.
# Fill the form in the Actions tab; the result comes back as a downloadable artifact
# and nothing is committed. Runner contract as in nightly-report.yml.
name: custom-report

on:
  workflow_dispatch:
    inputs:
      ops:
        description: ops to measure, comma separated (e.g. relu_max,leaky_relu)
        required: true
      params:
        description: values to measure them at (e.g. relu_max=6,leaky_relu=0.2)
        required: false
      arch:
        type: choice
        options: [wh, bh]
        default: wh
      dtype:
        type: choice
        options: [bf16, fp32, both]
        default: bf16

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tt.outputs.version }}
    steps:
      - id: tt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo tenstorrent/tt-metal --json tagName \
            --jq .tagName | sed 's/^v//')
          [ -n "$version" ] || { echo "no tt-metal release resolved"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  measure:
    needs: resolve
    runs-on: ${{ inputs.arch == 'wh' && 'tt-ubuntu-2204-n300-stable' || 'tt-ubuntu-2204-p150b-stable' }}
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:${{ needs.resolve.outputs.version }}
      options: --device /dev/tenstorrent
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: tt-metal source for `models`
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: v${{ needs.resolve.outputs.version }}
          path: tt-metal
          fetch-depth: 1

      - name: Check what the image provides
        run: |
          pip install --quiet matplotlib pandas numpy loguru
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tt-metal" python3 -c "
          import ttnn, torch
          from models.common.utility_functions import ulp
          print('ttnn and torch', torch.__version__)"

      - name: Measure at the requested parameters
        # Its own DATA_DIR and no build: this measures whatever tt-metal the runner
        # already has, against parameters the published report does not carry.
        # Inputs arrive as environment variables, never interpolated into the script:
        # ${{ inputs.params }} inline would let anyone who can press the button run
        # arbitrary shell on the runner.
        env:
          DATA_DIR: ${{ runner.temp }}/custom-data
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tt-metal
          OPS: ${{ inputs.ops }}
          PARAMS: ${{ inputs.params }}
          ARCH: ${{ inputs.arch }}
          DTYPE: ${{ inputs.dtype }}
        run: |
          # `|| status=$?`, never a bare call: the shell runs with -e, and measure exits
          # with the number of variants that produced no data. Someone trying a parameter
          # that does not work is the likeliest user of this form, and the report of what
          # happened is exactly what they came for — losing it is the worst outcome.
          status=0
          python3 -m ttnn_accuracy.cli measure --arch "$ARCH" --ops "$OPS" --dtype "$DTYPE" \
            ${PARAMS:+--params "$PARAMS"} || status=$?
          if [ "$status" -ge 128 ]; then
            echo "::error::measure died with signal $((status - 128))"
            exit 1
          fi
          [ "$status" -eq 0 ] || echo "::warning::$status variant(s) produced no data"
          python3 -m ttnn_accuracy.cli charts
          python3 -m ttnn_accuracy.cli report \
            --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw

      - uses: actions/upload-artifact@v4
        # Even after a hard failure: whatever did measure is still the answer to the
        # question that was asked.
        if: always()
        with:
          name: custom-report-${{ inputs.arch }}-${{ github.run_id }}
          path: |
            reports/
            report_index.json
          retention-days: 14

      - name: Leave the checkout clean
        # The published report lives in git; this run must not be mistaken for it. Detached
        # because the next run's checkout deletes every local branch before reusing the
        # clone, and cannot delete the one still checked out here.
        if: always()
        run: |
          # ask.md as well, or this run's parameters land in the next nightly's commit.
          git checkout -- reports/ report_index.json analyze-report/ask.md
          git checkout --detach 2>/dev/null || true
