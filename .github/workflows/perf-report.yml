# Kernel timing at a tt-metal commit you name, and the comparison between two.
#
# Give one commit and you get its timings. Give two and both are built and timed on the
# same host, back to back, and the run reports what moved. Two commits because a timing is
# a property of the machine as much as of the kernel: comparing against a number taken on
# another box, or on another day, measures the box.
#
# Dispatch only. Shared-pool runner, in tt-metal's build image so it can build the
# commit it was given; the release image only answers for commits already released.
name: perf-report

on:
  workflow_dispatch:
    inputs:
      commit:
        description: tt-metal commit to time — a full SHA or a branch; an abbreviation
          only resolves if it is reachable from main
        required: true
        default: main
      against:
        description: second tt-metal commit — given, the run compares the two
        required: false
      arch:
        type: choice
        options: [wh, bh]
        default: wh
      ops:
        description: ops to time, comma separated (default all)
        required: false
      dtype:
        type: choice
        options: [both, bf16, fp32]
        default: both

jobs:
  time:
    runs-on: ${{ inputs.arch == 'wh' && 'tt-ubuntu-2204-n300-stable' || 'tt-ubuntu-2204-p150b-stable' }}
    # The build image, not the release one: this builds the commit it was given, which is
    # the whole feature — a released image can only answer for commits already released.
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:latest
      options: --device /dev/tenstorrent
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Shared with the nightly: a device running a six-hour sweep times the sweep.
    concurrency:
      group: nightly-report-${{ inputs.arch }}
      cancel-in-progress: false
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: tt-metal to build
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          path: tt-metal
          fetch-depth: 0
          submodules: recursive

      - name: Where this job puts things
        run: |
          echo "TT_METAL_HOME=$GITHUB_WORKSPACE/tt-metal" >> "$GITHUB_ENV"
          echo "TT_METAL_CACHE=$RUNNER_TEMP/kernel-cache" >> "$GITHUB_ENV"
          echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tt-metal" >> "$GITHUB_ENV"
          pip install --quiet matplotlib pandas numpy loguru

      - name: Build and time each commit
        # Inputs arrive as environment variables, never interpolated into the script: a
        # commit field expanded inline would run as shell on the runner.
        env:
          COMMIT: ${{ inputs.commit }}
          AGAINST: ${{ inputs.against }}
          OPS: ${{ inputs.ops || 'all' }}
          DTYPE: ${{ inputs.dtype }}
          ARCH: ${{ inputs.arch }}
          LOGURU_FORMAT: "{message}"
        run: |
          # Up front: perf writes into it, and order.txt must survive a run that crashed
          # before writing anything.
          mkdir -p timings

          for ref in $AGAINST $COMMIT; do    # baseline first, so the candidate is timed last
            cd "$TT_METAL_HOME"
            # By URL, not by remote name: a runner's origin may be a personal fork where
            # the SHA does not exist.
            # An abbreviation cannot be fetched: fall back to main and resolve against it.
            git fetch --recurse-submodules=no https://github.com/tenstorrent/tt-metal.git "$ref" \
              && git checkout --force FETCH_HEAD \
              || { git fetch --recurse-submodules=no \
                     https://github.com/tenstorrent/tt-metal.git main; \
                   git checkout --force "$ref" \
                     || { echo "::error::$ref is not a commit on tenstorrent/tt-metal"; exit 1; }; }
            git submodule update --init --recursive
            ./build_metal.sh
            # Kernels compiled against the previous build segfault under new host code,
            # and the cache key does not capture that.
            rm -rf "$TT_METAL_CACHE"
            sha=$(git rev-parse --short=11 HEAD)

            cd "$GITHUB_WORKSPACE"
            # Tee'd so the run page shows the timings even for a single commit, where
            # there is no comparison to print and a green job would otherwise say nothing.
            status=0
            python3 -m ttnn_accuracy.cli perf --arch "$ARCH" --ops "$OPS" --dtype "$DTYPE" \
              --out "timings/$sha.json" 2>&1 | tee "$RUNNER_TEMP/$sha.log" || status=$?
            # Under 128 the status counts variants that produced no timing; 128+ is the
            # signal that killed it, and perf rewrites its file per op, so what was timed
            # before the crash is still on disk and still worth publishing.
            if [ "$status" -ge 128 ]; then
              echo "::error::$sha died with signal $((status - 128)) — timings up to that op kept"
            elif [ "$status" -ne 0 ]; then
              echo "::warning::$sha: $status variant(s) produced no timing"
            fi
            echo "$sha" >> timings/order.txt

            {
              echo "## $sha on $(hostname)"
              echo '```'
              grep "Melem/s" "$RUNNER_TEMP/$sha.log" || echo "nothing timed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Compare
        if: inputs.against != ''
        env:
          LOGURU_FORMAT: "{message}"
        run: |
          base=$(sed -n 1p timings/order.txt)
          cand=$(sed -n 2p timings/order.txt)
          # Exits 1 when something got slower — a result to report, not a failed run.
          python3 -m ttnn_accuracy.cli perf-diff "timings/$base.json" "timings/$cand.json" \
            --findings timings/perf-diff.md || true
          cat timings/perf-diff.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        # Even after a failure: whatever was timed still answers the question asked.
        if: always()
        with:
          name: timings-${{ inputs.arch }}-${{ github.run_id }}
          path: timings/
          retention-days: 14

      - name: Drop the timings the artifact already holds
        if: always()
        run: rm -rf timings
