name: validate-kernel

on:
  workflow_dispatch:
    inputs:
      commit:
        description: tt-metal commit or branch to validate — an abbreviation
          only resolves if it is reachable from main
        required: true
      ops:
        description: ops the change touches, comma separated (e.g. exp,gelu)
        required: true
      arch:
        type: choice
        options: [wh, bh]
        default: wh
      dtype:
        type: choice
        options: [both, bf16, fp32]
        default: both
      max_ulp:
        description: also fail any variant worse than this, whatever the baseline says
        required: false
      params:
        description: measure at a different scalar, e.g. relu_max=6
        required: false
  # The same job, driven by `accuracy-command` instead of by hand. Inputs are declared twice
  # because GitHub keeps the two trigger schemas separate; `inputs.*` reads the same either way.
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      ops:
        type: string
        required: true
      arch:
        type: string
        default: wh
      dtype:
        type: string
        default: both
      max_ulp:
        type: string
        required: false
      params:
        type: string
        required: false

jobs:
  validate:
    runs-on: ${{ inputs.arch == 'wh' && 'tt-ubuntu-2204-n300-stable' || 'tt-ubuntu-2204-p150b-stable' }}
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:latest
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: device-${{ inputs.arch }}
      cancel-in-progress: false
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # The baseline this run is measured against. It lives on `report`, not on the default
      # branch, so a plain checkout has nothing for `check` to diff against.
      - name: Fetch the published baseline
        run: |
          # `checkout` marks the workspace safe in a global config it throws away when the
          # action ends, so the first git of the job is refused unless this repeats it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Over git, as the sweep does: this runs in tt-metal's build image, which carries
          # no `gh`. The ref is named because a checkout fetches only the branch it started
          # on, and one commit of it is enough — nothing here reads the branch's history.
          git fetch --no-tags --depth=1 origin +report:refs/remotes/origin/report
          # Written aside and moved, because `>` truncates before `git show` runs and
          # `check` reads an empty index as unparseable rather than as absent.
          git show origin/report:report_index.json > baseline.json
          mv baseline.json report_index.json

      - uses: ./.github/actions/tt-metal-env
        with:
          builds: 'true'

      # The other half of every chart. The published index carries summaries, not rows, so
      # main's curve cannot be read from it — only a build of main produces one.
      - name: Build main and measure it
        env:
          OPS: ${{ inputs.ops }}
          ARCH: ${{ inputs.arch }}
          DTYPE: ${{ inputs.dtype }}
          PARAMS: ${{ inputs.params }}
          LOGURU_FORMAT: "{message}"
          LOGURU_LEVEL: INFO
          TT_LOGGER_LEVEL: error
          TT_METAL_LOGGER_LEVEL: error
        run: |
          cd "$TT_METAL_HOME"
          git fetch --depth=1 --recurse-submodules=no \
            https://github.com/tenstorrent/tt-metal.git main
          git checkout --force FETCH_HEAD
          git submodule update --init --recursive --depth 1
          ./build_metal.sh --enable-ccache --disable-profiler
          uv pip install --quiet --python "$(command -v python3)" -e "$TT_METAL_HOME"
          rm -rf "$TT_METAL_CACHE"
          cd "$GITHUB_WORKSPACE"
          python3 -m ttnn_accuracy.cli measure --arch "$ARCH" --ops "$OPS" --dtype "$DTYPE" \
            --output-dir main-data ${PARAMS:+--params "$PARAMS"}

      - name: Build the candidate
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          cd "$TT_METAL_HOME"
          git fetch --depth=1 --recurse-submodules=no \
            https://github.com/tenstorrent/tt-metal.git "$COMMIT" \
            && git checkout --force FETCH_HEAD \
            || { git fetch --recurse-submodules=no \
                   https://github.com/tenstorrent/tt-metal.git main; \
                 git checkout --force "$COMMIT" \
                   || { echo "::error::$COMMIT is not a commit on tenstorrent/tt-metal"; exit 1; }; }
          git submodule update --init --recursive --depth 1
          # Tracy is on by default and nothing here reads it: the timings are host-side wall
          # clock. ccache is inert without a warm cache, and costs nothing when it misses.
          ./build_metal.sh --enable-ccache --disable-profiler
          uv pip install --quiet --python "$(command -v python3)" -e "$TT_METAL_HOME"
          rm -rf "$TT_METAL_CACHE"
          echo "SHA=$(git rev-parse --short=11 HEAD)" >> "$GITHUB_ENV"

      - name: Measure them against the published baseline
        env:
          OPS: ${{ inputs.ops }}
          ARCH: ${{ inputs.arch }}
          DTYPE: ${{ inputs.dtype }}
          MAX_ULP: ${{ inputs.max_ulp }}
          PARAMS: ${{ inputs.params }}
          LOGURU_FORMAT: "{message}"
          LOGURU_LEVEL: INFO
          TT_LOGGER_LEVEL: error
          TT_METAL_LOGGER_LEVEL: error
          CHART_HOST: https://raw.githubusercontent.com/${{ github.repository }}/pr-charts/charts
        run: |
          python3 -c "
          import pathlib, ttnn
          assert ttnn.__file__, 'ttnn is a namespace package; the built one is not on PYTHONPATH'
          p = pathlib.Path(ttnn.__file__)
          assert p.is_relative_to('$TT_METAL_HOME'), f'ttnn came from {p}, not $TT_METAL_HOME'
          print('ttnn', p)"

          status=0
          python3 -m ttnn_accuracy.cli check --arch "$ARCH" --ops "$OPS" --dtype "$DTYPE" --perf \
            --summary "table-$ARCH.md" --against main-data --charts charts \
            ${MAX_ULP:+--max-ulp "$MAX_ULP"} ${PARAMS:+--params "$PARAMS"} \
            2>&1 | tee check.log || status=$?

          verdict=$( [ "$status" -eq 0 ] && echo "nothing moved" || echo "$status finding(s)" )
          # The table is the answer; the log is the artifact, folded away for whoever wants it.
          {
            echo "<details open><summary><b>$ARCH</b> — $verdict at <code>$SHA</code></summary>"
            echo
            cat "table-$ARCH.md" 2>/dev/null || echo "_no table; see the log_"
            echo
            # Named for this run, because every pull request shares the one chart release.
            for png in charts/*.png; do
              [ -e "$png" ] || break
              asset="$GITHUB_RUN_ID-$(basename "$png")"
              mv "$png" "charts/$asset"
              echo "![${asset%.png}]($CHART_HOST/$asset)"
              echo
            done
            echo "<details><summary>log</summary>"
            echo
            echo '```'
            tail -60 check.log
            echo '```'
            echo "</details></details>"
          } > "result-$ARCH.md"
          cat "result-$ARCH.md" >> "$GITHUB_STEP_SUMMARY"
          # Informational: a finding is the answer, not a failure, so it must not paint a
          # pull request red. A run that produced no table did not answer at all, and does.
          [ "$status" -eq 0 ] || echo "::notice::$status finding(s) — see the table"
          [ -s "table-$ARCH.md" ] || { echo "::error::check produced no table"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-${{ inputs.arch }}-${{ github.run_id }}
          path: |
            check.log
            result-${{ inputs.arch }}.md
            charts/
          retention-days: 14

      - name: Leave the checkout clean
        if: always()
        run: |
          rm -f check.log
          git checkout -- stats/ 2>/dev/null || true
