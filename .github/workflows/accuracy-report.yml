name: accuracy-report

# One workflow, two uses, separated only by how much it measures:
#   the weekly cron sweeps everything and publishes;
#   a dispatch measures whatever you name, at parameters the published report does not carry.
# Results land on `report`, never on the default branch: a ruleset there requires a pull
# request, and the report is 100 MB of generated data that no one reviews.
on:
  schedule:
    - cron: "37 2 * * 6" # Saturday: every category, both dtypes, published
  workflow_dispatch:
    inputs:
      arch:
        description: which architectures to measure
        type: choice
        options: [both, wh, bh]
        default: both
      categories:
        description: categories to sweep, comma separated, or `all`
        default: all
      ops:
        description: ops to measure instead of whole categories (e.g. relu_max,leaky_relu)
        default: ""
      params:
        description: values to measure them at (e.g. relu_max=6,leaky_relu=0.2)
        default: ""
      dtype:
        type: choice
        options: [both, bf16, fp32]
        default: both
      publish:
        description: commit the result — ignored unless this run measures everything
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Data only, and never the default branch: a ruleset there requires a pull request.
  REPORT_BRANCH: report
  # Everything the report branch carries, and nothing else — the seed, the publish and the
  # branch's own tree are all defined by this one list.
  DATA: reports report_index.json stats analyze-report/ask.md

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tt.outputs.version }}
      targets: ${{ steps.scope.outputs.targets }}
      categories: ${{ steps.scope.outputs.categories }}
      ops: ${{ steps.scope.outputs.ops }}
      params: ${{ steps.scope.outputs.params }}
      dtype: ${{ steps.scope.outputs.dtype }}
      complete: ${{ steps.scope.outputs.complete }}
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - id: tt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo tenstorrent/tt-metal --json tagName --jq .tagName)
          [ -n "$version" ] || { echo "no tt-metal release resolved"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Free text reaches the shell through env, never interpolated into the script.
      - id: scope
        env:
          ARCH: ${{ inputs.arch || 'both' }}
          CATEGORIES: ${{ inputs.categories || 'all' }}
          OPS: ${{ inputs.ops }}
          PARAMS: ${{ inputs.params }}
          DTYPE: ${{ inputs.dtype || 'both' }}
          # Empty on a cron. Not `inputs.publish == false`: GitHub casts null and false alike,
          # so that comparison is true on every scheduled run and the weekly sweep would
          # silently stop publishing.
          PUBLISH: ${{ inputs.publish }}
        run: |
          ALL=unary,unary_bw,binary,binary_bw,ternary,ternary_bw
          if [ "$CATEGORIES" = all ]; then CATEGORIES=$ALL; fi

          # Publishing is a property of the run, not a wish: only a whole sweep may overwrite
          # the baseline, because `charts` merges into the published index and a partial run
          # would leave it half at one tt-metal commit and half at another.
          complete=false
          if [ -z "$OPS" ] && [ -z "$PARAMS" ] && [ "$DTYPE" = both ] && [ "$CATEGORIES" = "$ALL" ]
          then complete=true
          fi
          publish=false
          if [ "$complete" = true ] && [ "$PUBLISH" != false ]; then publish=true; fi

          wh='{"arch":"wh","runner":"tt-ubuntu-2204-n300-stable"}'
          bh='{"arch":"bh","runner":"tt-ubuntu-2204-p150b-stable"}'
          case "$ARCH" in
            wh) targets="[$wh]" ;;
            bh) targets="[$bh]" ;;
            *)  targets="[$wh,$bh]" ;;
          esac

          {
            echo "targets=$targets"
            echo "categories=$CATEGORIES"
            echo "ops=$OPS"
            echo "params=$PARAMS"
            echo "dtype=$DTYPE"
            echo "complete=$complete"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "measuring ${OPS:-$CATEGORIES} in $DTYPE on $ARCH; publish=$publish"

  # Before any device time. Two publish bugs each cost a full sweep because `Publish` is the
  # last step of a 16h job, so the whole push path — credentials, refs, the temporary index,
  # commit-tree — is exercised here first, in seconds, against the branch it will really use.
  # It also makes `report` exist unconditionally, which is why nothing downstream tests for it.
  baseline:
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the report branch exists and can be pushed to
        run: |
          git config user.name accuracy-report
          git config user.email accuracy-report@users.noreply.github.com

          if git fetch --no-tags origin "+$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH"; then
            git show "origin/$REPORT_BRANCH:report_index.json" | python3 -c \
              'import json,sys; json.load(sys.stdin)' \
              || { echo "::error::$REPORT_BRANCH carries an unreadable report_index.json"; exit 1; }
            echo "$REPORT_BRANCH is present and readable"
            exit 0
          fi

          # First run ever. Seed from whatever the default branch still carries, or from an
          # empty index once it carries nothing — `charts` merges into either.
          [ -f report_index.json ] || echo '{}' > report_index.json
          seed=""
          for path in $DATA; do
            if [ -e "$path" ]; then seed="$seed $path"; fi
          done
          export GIT_INDEX_FILE="$RUNNER_TEMP/seed.index"
          git add -A -- $seed
          commit=$(git commit-tree "$(git write-tree)" -m "data: seed the report branch")
          unset GIT_INDEX_FILE
          git push origin "$commit:refs/heads/$REPORT_BRANCH"
          echo "created $REPORT_BRANCH"

  measure:
    needs: [scope, baseline]
    # `baseline` is skipped when this run does not publish, and a skipped need would
    # otherwise skip the whole matrix. Only a real failure there should stop the sweep.
    if: always() && needs.scope.result == 'success' && needs.baseline.result != 'failure'
    strategy:
      matrix:
        target: ${{ fromJSON(needs.scope.outputs.targets) }}
      # Parallel: the two archs are different machines, and `concurrency` below already
      # keeps one run per device. Serialised, a full sweep took 28h of wall clock.
      fail-fast: false
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:${{ needs.scope.outputs.version }}
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: device-${{ matrix.target.arch }}
      cancel-in-progress: false
    # A full sweep measured 9h49m before per-point counting and 18% under the old 12h cap,
    # so the cap, not the work, was the thing that broke.
    timeout-minutes: 1200
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The checkout carries code; the last published figures live on `report`. Without this
      # every run would diff against, and republish, whatever data main happens to still hold.
      - name: Start from the published report
        run: |
          # Not shallow: Publish fetches this ref again, and analyze-report reads its parent.
          # A non-publishing run skipped `baseline`, so the branch is not guaranteed here.
          git fetch --no-tags origin \
            "+$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH" 2>/dev/null || {
            echo "no $REPORT_BRANCH yet — measuring against the checkout"; exit 0; }
          # Data paths only, and only the ones the branch holds. Never its whole tree: a
          # reseed from the default branch leaves `src` on `report`, and checking that out
          # would run this job against older code than the commit it was started at.
          for path in $DATA; do
            if git cat-file -e "origin/$REPORT_BRANCH:$path" 2>/dev/null; then
              git checkout "origin/$REPORT_BRANCH" -- "$path"
            fi
          done
          git reset --quiet

      - uses: ./.github/actions/tt-metal-env
        with:
          ref: ${{ needs.scope.outputs.version }}

      # Only a whole sweep refreshes the manifest: a named-ops run has no business
      # rewriting what every other op's page says about scope.
      - name: Refresh the manifest
        if: needs.scope.outputs.complete == 'true'
        run: |
          python3 -m ttnn_accuracy.cli discover
          python3 -m ttnn_accuracy.cli derive
          python3 -m ttnn_accuracy.cli probe

      - name: Measure
        env:
          ARCH: ${{ matrix.target.arch }}
          CATEGORIES: ${{ needs.scope.outputs.categories }}
          OPS: ${{ needs.scope.outputs.ops }}
          PARAMS: ${{ needs.scope.outputs.params }}
          DTYPE: ${{ needs.scope.outputs.dtype }}
        run: |
          # The CLI's exit code is a count of variants that produced no data, so every call
          # tolerates it; 128 and above is a signal, which a second attempt resumes from the
          # CSVs the first one wrote.
          empty=0
          measure() {
            for attempt in 1 2; do
              status=0
              python3 -m ttnn_accuracy.cli measure --arch "$ARCH" --dtype "$DTYPE" "$@" || status=$?
              if [ "$status" -lt 128 ]; then
                empty=$((empty + status))
                return 0
              fi
              echo "::warning::$* died with signal $((status - 128)), resuming"
            done
          }

          if [ -n "$OPS" ]
          then measure --ops "$OPS" ${PARAMS:+--params "$PARAMS"}
          else
            for cat in ${CATEGORIES//,/ }; do measure --category "$cat"; done
          fi

          [ "$empty" -eq 0 ] || echo "::warning::$empty variant(s) produced no data — see the report"

      - name: Time every variant
        if: needs.scope.outputs.complete == 'true'
        run: |
          status=0
          python3 -m ttnn_accuracy.cli perf --arch "${{ matrix.target.arch }}" || status=$?
          [ "$status" -eq 0 ] || echo "::warning::perf exited $status — see the log for which"

      - name: Rebuild the charts and pages
        run: |
          python3 -m ttnn_accuracy.cli charts
          python3 -m ttnn_accuracy.cli report \
            --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw

      # Named ops only: one op is 10 MB in their schema, so a whole sweep would be gigabytes.
      # This is how a measurement gets zoom and pan — GitHub strips scripts from `reports/`,
      # but the LLK dashboard loads a harness CSV in the browser.
      - name: Export for the LLK dashboard
        if: needs.scope.outputs.ops != ''
        run: |
          # DATA_DIR holds only what this run measured, and a run of pair ops exports nothing.
          python3 -m ttnn_accuracy.cli export --arch "${{ matrix.target.arch }}" --out export || true

      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.ops != ''
        with:
          name: llk-csv-${{ matrix.target.arch }}-${{ github.run_id }}
          path: export/
          retention-days: 14

      # Always: for a published sweep this is the night's diff, and for a subset run it is
      # the whole point — the early warning, without writing anything.
      - name: Say what moved
        env:
          LOGURU_FORMAT: "{message}"
        run: |
          # A non-publishing run never ran `baseline`, so the branch may genuinely be absent.
          git cat-file -e "origin/$REPORT_BRANCH:report_index.json" 2>/dev/null || exit 0
          git show "origin/$REPORT_BRANCH:report_index.json" > previous.json
          {
            echo "## ${{ matrix.target.arch }} at ${{ needs.scope.outputs.version }}"
            echo '```'
            python3 -m ttnn_accuracy.cli compare previous.json 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f previous.json

      # A named-ops run is read on the run page; a category sweep would paste 92 pages.
      - name: Put the measurements on the run page
        if: always() && needs.scope.outputs.ops != ''
        env:
          OPS: ${{ needs.scope.outputs.ops }}
          PARAMS: ${{ needs.scope.outputs.params }}
          ARCH: ${{ matrix.target.arch }}
          DTYPE: ${{ needs.scope.outputs.dtype }}
        run: |
          [ "$DTYPE" = both ] && dtypes="bf16 fp32" || dtypes="$DTYPE"
          {
            echo "## \`$OPS\` on $ARCH at \`${PARAMS:-defaults}\`"
            echo
            for op in ${OPS//,/ }; do
              for d in $dtypes; do
                page="reports/by_arch/$ARCH/$d/$op.md"
                [ -f "$page" ] || { echo "No page for $ARCH/$d/$op."; echo; continue; }
                sed '/^_Measured on/q' "$page" |
                  grep -v '^\[← \|^_This page is auto-generated\|^---$' |
                  sed 's/^# /### /'
                echo
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Regenerated onto whatever landed, never rebased onto it: two archs each rewrite the
      # whole tree, so every generated file conflicts and no rebase can ever succeed. The CSVs
      # are still on this runner, so re-running charts re-applies this arch on top of the other.
      # The commit is built with a temporary index and pushed by SHA, so `report` carries data
      # alone and this checkout keeps its code and its HEAD throughout.
      - name: Publish
        if: needs.scope.outputs.publish == 'true'
        run: |
          git config user.name accuracy-report
          git config user.email accuracy-report@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch --no-tags origin "+$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH"
            # Merge into whatever the other arch published, not into this checkout's copy.
            # `baseline` guaranteed both the branch and a readable index before any measuring.
            git show "origin/$REPORT_BRANCH:report_index.json" > report_index.json
            python3 -m ttnn_accuracy.cli charts
            python3 -m ttnn_accuracy.cli report \
              --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw

            export GIT_INDEX_FILE="$RUNNER_TEMP/report.index"
            rm -f "$GIT_INDEX_FILE"
            git add -A -- $DATA
            tree=$(git write-tree)
            parent=$(git rev-parse --verify --quiet "origin/$REPORT_BRANCH" || true)
            [ "$tree" != "$(git rev-parse --verify --quiet "$parent^{tree}" || true)" ] || {
              echo "no change to publish"; exit 0; }
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
              -m "data(${{ matrix.target.arch }}): accuracy report at ${{ needs.scope.outputs.version }}")
            unset GIT_INDEX_FILE

            git push origin "$commit:refs/heads/$REPORT_BRANCH" && exit 0
            echo "someone else published first, regenerating ($attempt)"; sleep $((attempt * 10))
          done
          echo "could not publish; the measurements are on the runner's disk"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.publish != 'true'
        with:
          name: accuracy-report-${{ matrix.target.arch }}-${{ github.run_id }}
          path: |
            reports/
            report_index.json
          retention-days: 14

      - name: Leave the workspace as it was found
        if: always()
        run: |
          # `report` data was copied in, never committed here, so the checkout is restored whole.
          git checkout -- reports/ report_index.json analyze-report/ask.md stats/ 2>/dev/null || true
          git checkout --detach 2>/dev/null || true
