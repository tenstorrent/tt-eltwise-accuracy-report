name: nightly-report

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      arch:
        description: which architectures to measure
        type: choice
        options: [both, wh, bh]
        default: both

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tt.outputs.version }}
      targets: ${{ steps.targets.outputs.list }}
    steps:
      - id: tt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo tenstorrent/tt-metal --json tagName --jq .tagName)
          [ -n "$version" ] || { echo "no tt-metal release resolved"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: targets
        run: |
          wh='{"arch":"wh","runner":"tt-ubuntu-2204-n300-stable"}'
          bh='{"arch":"bh","runner":"tt-ubuntu-2204-p150b-stable"}'
          case "${{ inputs.arch || 'both' }}" in
            wh) list="[$wh]" ;;
            bh) list="[$bh]" ;;
            *)  list="[$wh,$bh]" ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"

  measure:
    needs: pin
    strategy:
      matrix:
        target: ${{ fromJSON(needs.pin.outputs.targets) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:${{ needs.pin.outputs.version }}
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: nightly-report-${{ matrix.target.arch }}
      cancel-in-progress: false
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/tt-metal-env
        with:
          ref: ${{ needs.pin.outputs.version }}

      - name: Measure and regenerate
        run: |
          ttnn-accuracy() { python3 -m ttnn_accuracy.cli "$@"; }
          ttnn-accuracy discover
          ttnn-accuracy derive
          ttnn-accuracy probe
          empty=0
          for cat in unary unary_bw binary binary_bw ternary ternary_bw; do
            for attempt in 1 2; do
              status=0
              ttnn-accuracy measure --arch "${{ matrix.target.arch }}" --category "$cat" --dtype both ||
                status=$?
              if [ "$status" -lt 128 ]; then
                empty=$((empty + status))
                break
              fi
              echo "::warning::$cat died with signal $((status - 128)), resuming"
            done
          done
          status=0
          ttnn-accuracy perf --arch "${{ matrix.target.arch }}" || status=$?
          [ "$status" -eq 0 ] || echo "::warning::perf exited $status — see the log for which"
          ttnn-accuracy charts
          ttnn-accuracy report --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw
          [ "$empty" -eq 0 ] || echo "::warning::$empty variant(s) produced no data — see the report"

      - name: Say what moved
        env:
          LOGURU_FORMAT: "{message}"
        run: |
          git show HEAD:report_index.json > "$RUNNER_TEMP/previous.json" 2>/dev/null || exit 0
          {
            echo "## ${{ matrix.target.arch }} at ${{ needs.pin.outputs.version }}"
            echo '```'
            python3 -m ttnn_accuracy.cli compare "$RUNNER_TEMP/previous.json" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: |
          git add -A reports/ report_index.json stats/ analyze-report/ask.md
          git diff --cached --quiet && { echo "no change to publish"; exit 0; }
          git -c user.name=nightly-report -c user.email=nightly@users.noreply.github.com \
            commit -m "data(${{ matrix.target.arch }}): nightly report at ${{ needs.pin.outputs.version }}"
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin "$GITHUB_REF_NAME" &&
              git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "push race, retrying ($attempt)"; sleep $((attempt * 10))
          done
          echo "could not publish; the measurements are on the runner's disk"
          exit 1

      - name: Leave the workspace detached
        if: always()
        run: |
          git rebase --abort 2>/dev/null || true
          git checkout --detach 2>/dev/null || true
