# Periodic report regeneration, no human intervention (the epic's automation bullet).
#
# Runner contract — a self-hosted runner labelled `wh` or `bh`, on a machine with that
# device, whose environment provides:
#   TT_METAL_HOME  a tt-metal checkout the runner may rebuild (any remote layout)
#   PYTHON_ENV     its venv, with ttnn and torch importable
#   DATA_DIR       a large local disk for the raw CSVs (hundreds of GB, never committed)
#
# Nothing else is assumed: not where the venv sits relative to tt-metal, not which
# remote the checkout tracks, not that the machines have separate home directories.
name: nightly-report

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      arch:
        description: which architectures to measure
        type: choice
        options: [both, wh, bh]
        default: both


permissions:
  contents: write

jobs:
  pin:
    # One SHA for the whole night. The bh job starts hours after wh, so resolving main
    # separately per job would measure the two architectures on different builds.
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tt.outputs.sha }}
      archs: ${{ steps.archs.outputs.list }}
    steps:
      - id: tt
        # The fully qualified ref: tt-metal also has branches like `bliu/main`, and a
        # bare `main` matches them too, putting two SHAs in the output.
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/tenstorrent/tt-metal.git refs/heads/main | awk '{print $1}')
          [ ${#sha} -eq 40 ] || { echo "resolved '$sha', not one SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: archs
        # Only measure what has a runner today: a job for an unregistered label queues
        # for hours and then times out, which reads as a failure rather than a choice.
        run: |
          case "${{ inputs.arch || 'both' }}" in
            wh) list='["wh"]' ;;
            bh) list='["bh"]' ;;
            *)  list='["wh","bh"]' ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"

  measure:
    needs: pin
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.pin.outputs.archs) }}
      # Serial, because both jobs regenerate report_index.json and reports/: git cannot
      # merge those textually, and a rebase conflict poisons the tree for every retry.
      # A nightly has all night, and one writer at a time is cheaper than teaching two
      # jobs to merge generated JSON.
      max-parallel: 1
      fail-fast: false  # one architecture failing must not cancel the other
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    # Per architecture, not per workflow: the two use different machines and devices, and
    # the only thing they share is the push, which rebases and retries.
    concurrency:
      group: nightly-report-${{ matrix.arch }}
      cancel-in-progress: false
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the publish step rebases; a shallow clone cannot

      - name: Check the runner contract
        run: |
          for var in TT_METAL_HOME PYTHON_ENV DATA_DIR; do
            [ -n "${!var:-}" ] || { echo "$var is unset — see the runner contract above"; exit 1; }
          done
          [ -x "$TT_METAL_HOME/build_metal.sh" ] || { echo "no tt-metal at $TT_METAL_HOME"; exit 1; }
          [ -f "$PYTHON_ENV/bin/activate" ] || { echo "no venv at $PYTHON_ENV"; exit 1; }
          command -v uv >/dev/null || { echo "uv is not on PATH — the venv has no pip"; exit 1; }
          mkdir -p "$DATA_DIR"
          # Kernel cache on the machine's own disk, one per architecture. The default
          # lives under $HOME, which these runners share over NFS: both jobs would then
          # compile into one directory, and neither could clear it while the other holds
          # files open. Written through GITHUB_ENV because the runner's environment is
          # visible to the shell, never to the `env` expression context.
          echo "TT_METAL_CACHE=$DATA_DIR/kernel-cache-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Build tt-metal at the pinned SHA
        # Fetched by URL, not by remote name: a runner's checkout may have `origin` on a
        # personal fork, where the SHA the pin job resolved upstream does not exist.
        # cd in the shell, never `working-directory: ${{ env.TT_METAL_HOME }}`: the env
        # context holds only what the workflow file declares, so that expression is
        # empty and every command below would run in this repo's checkout — which once
        # overwrote it with tt-metal and repointed the venv at it.
        run: |
          cd "$TT_METAL_HOME"
          git fetch --recurse-submodules=no \
            https://github.com/tenstorrent/tt-metal.git ${{ needs.pin.outputs.sha }}
          git checkout --force ${{ needs.pin.outputs.sha }}
          git submodule update --init --recursive
          ./build_metal.sh
          # Kernels compiled against the previous build segfault when dispatched against
          # new host code, and the cache key does not capture that. This cache belongs to
          # this architecture on this disk, so nothing else can be holding it open.
          rm -rf "$TT_METAL_CACHE"

      - name: Measure and regenerate
        # DATA_DIR is read by every stage, so measure writes where charts will look.
        # uv, not pip: tt-metal's venv is built by uv and has no pip of its own, so
        # `pip install` would silently fall through to the system one.
        run: |
          source "$PYTHON_ENV/bin/activate"
          # Never install: the venv is shared with whoever uses this machine, and
          # `pip install -e .` rebinds their editable checkout to this workspace. Running
          # from source needs no install and mutates nothing.
          export PYTHONPATH="$GITHUB_WORKSPACE/src:${PYTHONPATH:-}"
          ttnn-accuracy() { python3 -m ttnn_accuracy.cli "$@"; }
          # The venv reaches ttnn through a .pth of absolute paths, so a build run from
          # the wrong directory silently repoints it. Importing the wrong ttnn against a
          # freshly built libttnn segfaults, so refuse to measure rather than crash.
          python3 -c "
          import pathlib, ttnn, ttnn_accuracy
          for mod, root in ((ttnn, '$TT_METAL_HOME'), (ttnn_accuracy, '$GITHUB_WORKSPACE')):
              p = pathlib.Path(mod.__file__)
              assert p.is_relative_to(root), f'{mod.__name__} came from {p}, not {root}'
              print(mod.__name__, p)"
          ttnn-accuracy discover
          ttnn-accuracy derive
          ttnn-accuracy probe   # outlives a crashing op on its own; see probe_layouts
          # measure exits with the number of variants that produced no data, which is a
          # finding the report carries — not a reason to discard the categories after it,
          # nor the charts and pages built from everything that did measure.
          # Measuring is hours of device time and the device can go away under it — a
          # reset, a bus error, an expiring reservation. A second attempt resumes from
          # the CSVs the first one wrote, so an interruption costs one op, not the night.
          empty=0
          for cat in unary unary_bw binary binary_bw ternary ternary_bw; do
            for attempt in 1 2; do
              # `|| status=$?`, never a bare call: the shell runs with -e, so a non-zero
              # exit — which here is a count of findings, not an error — would kill the
              # step and abandon every category after this one.
              status=0
              ttnn-accuracy measure --arch "${{ matrix.arch }}" --category "$cat" --dtype both ||
                status=$?
              if [ "$status" -lt 128 ]; then   # a count of empty variants, not a signal
                empty=$((empty + status))
                break
              fi
              echo "::warning::$cat died with signal $((status - 128)), resuming"
            done
          done
          ttnn-accuracy charts
          ttnn-accuracy report --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw
          [ "$empty" -eq 0 ] || echo "::warning::$empty variant(s) produced no data — see the report"

      - name: Say what moved
        # The run page is where someone looks, so the diff against last night's committed
        # index is written there. Never gating: a change is news, not a failure.
        env:
          # loguru's default format carries colour markup and a timestamp/level/module
          # prefix, both of which reach the summary as literal escape codes.
          LOGURU_FORMAT: "{message}"
        run: |
          source "$PYTHON_ENV/bin/activate"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:${PYTHONPATH:-}"
          git show HEAD:report_index.json > "$RUNNER_TEMP/previous.json" 2>/dev/null || exit 0
          {
            echo "## ${{ matrix.arch }} at ${{ needs.pin.outputs.sha }}"
            echo '```'
            python3 -m ttnn_accuracy.cli compare "$RUNNER_TEMP/previous.json" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        # The other architecture may have pushed while this job measured, so rebase onto
        # it rather than racing; nothing to commit is a success, not a failure.
        run: |
          git add -A reports/ report_index.json stats/
          git diff --cached --quiet && { echo "no change to publish"; exit 0; }
          git -c user.name=nightly-report -c user.email=nightly@users.noreply.github.com \
            commit -m "data(${{ matrix.arch }}): nightly report at ${{ needs.pin.outputs.sha }}"
          for attempt in 1 2 3; do
            # Abort first: a conflicted rebase left by the previous attempt makes every
            # later pull fail with "unmerged files" rather than retrying anything.
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin "$GITHUB_REF_NAME" &&
              git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "push race, retrying ($attempt)"; sleep $((attempt * 10))
          done
          echo "could not publish; the measurements are on the runner's disk"
          exit 1

      - name: Leave the workspace detached
        # The next run's checkout deletes every local branch before reusing the clone, and
        # cannot delete the one still checked out here — it then re-clones the whole
        # history instead. A rebase left in progress blocks its detach for the same reason.
        if: always()
        run: |
          git rebase --abort 2>/dev/null || true
          git checkout --detach 2>/dev/null || true
