# Periodic report regeneration, no human intervention (the epic's automation bullet).
# Needs a self-hosted runner with a TT device, labelled wh or bh, providing
# TT_METAL_HOME (tt-metal checkout) and PYTHON_ENV (its built venv).
name: nightly-report

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-report   # never two overlapping nightly runs; max-parallel serializes the jobs
  cancel-in-progress: false

permissions:
  contents: write         # the Publish step pushes with the workflow token

jobs:
  pin:
    # One SHA for the whole night: the bh job runs hours after wh, and letting each pull
    # main at its own start time would measure the two architectures on different builds.
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tt.outputs.sha }}
    steps:
      - id: tt
        # The exact ref, and awk for the field: a bare `main` also matches other refs
        # ending in main, and two SHAs on the line make GITHUB_OUTPUT unparseable.
        run: |
          sha=$(git ls-remote https://github.com/tenstorrent/tt-metal.git refs/heads/main | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  measure:
    needs: pin
    strategy:
      matrix:
        arch: [wh, bh]
      max-parallel: 1
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the publish step rebases; a shallow clone cannot

      - name: Rebuild tt-metal at the pinned SHA
        run: |
          git -C "$TT_METAL_HOME" fetch origin
          git -C "$TT_METAL_HOME" checkout ${{ needs.pin.outputs.sha }}
          git -C "$TT_METAL_HOME" submodule update --init --recursive
          "$TT_METAL_HOME"/build_metal.sh

      - name: Regenerate the report
        run: |
          source "$PYTHON_ENV/bin/activate"
          pip install -e . --quiet
          ttnn-accuracy discover
          ttnn-accuracy derive
          ttnn-accuracy probe
          for cat in unary unary_bw binary binary_bw ternary ternary_bw; do
            ttnn-accuracy measure --arch "${{ matrix.arch }}" --category "$cat" --dtype both
          done
          ttnn-accuracy charts
          ttnn-accuracy report --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw

      - name: Publish
        run: |
          git add -A reports/ report_index.json stats/
          git -c user.name=nightly -c user.email=nightly@users.noreply.github.com \
            commit -m "data(${{ matrix.arch }}): nightly report $(date -u +%F)" || exit 0
          git pull --rebase && git push
