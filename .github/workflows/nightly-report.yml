# Periodic report regeneration, no human intervention (the epic's automation bullet).
#
# Runner contract — a self-hosted runner labelled `wh` or `bh`, on a machine with that
# device, whose environment provides:
#   TT_METAL_HOME  a tt-metal checkout the runner may rebuild (any remote layout)
#   PYTHON_ENV     its venv, with ttnn and torch importable
#   DATA_DIR       a large local disk for the raw CSVs (hundreds of GB, never committed)
name: nightly-report

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pin:
    # One SHA for the whole night. The bh job starts hours after wh, so resolving main
    # separately per job would measure the two architectures on different builds.
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tt.outputs.sha }}
    steps:
      - id: tt
        # The fully qualified ref: tt-metal also has branches like `bliu/main`, and a
        # bare `main` matches them too, putting two SHAs in the output.
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/tenstorrent/tt-metal.git refs/heads/main | awk '{print $1}')
          [ ${#sha} -eq 40 ] || { echo "resolved '$sha', not one SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  measure:
    needs: pin
    strategy:
      matrix:
        arch: [wh, bh]
      max-parallel: 1   # both jobs publish to the same branch
      fail-fast: false  # one architecture failing must not cancel the other
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the publish step rebases; a shallow clone cannot

      - name: Check the runner contract
        run: |
          for var in TT_METAL_HOME PYTHON_ENV DATA_DIR; do
            [ -n "${!var:-}" ] || { echo "$var is unset — see the runner contract above"; exit 1; }
          done
          [ -x "$TT_METAL_HOME/build_metal.sh" ] || { echo "no tt-metal at $TT_METAL_HOME"; exit 1; }
          [ -f "$PYTHON_ENV/bin/activate" ] || { echo "no venv at $PYTHON_ENV"; exit 1; }
          mkdir -p "$DATA_DIR"

      - name: Build tt-metal at the pinned SHA
        # Fetched by URL, not by remote name: a runner's checkout may have `origin` on a
        # personal fork, where the SHA the pin job resolved upstream does not exist.
        run: |
          git -C "$TT_METAL_HOME" fetch --recurse-submodules=no \
            https://github.com/tenstorrent/tt-metal.git ${{ needs.pin.outputs.sha }}
          git -C "$TT_METAL_HOME" checkout --force ${{ needs.pin.outputs.sha }}
          git -C "$TT_METAL_HOME" submodule update --init --recursive
          "$TT_METAL_HOME/build_metal.sh"

      - name: Measure and regenerate
        # DATA_DIR is read by every stage, so measure writes where charts will look.
        run: |
          source "$PYTHON_ENV/bin/activate"
          pip install -e . --quiet
          ttnn-accuracy discover
          ttnn-accuracy derive
          ttnn-accuracy probe
          for cat in unary unary_bw binary binary_bw ternary ternary_bw; do
            ttnn-accuracy measure --arch "${{ matrix.arch }}" --category "$cat" --dtype both
          done
          ttnn-accuracy charts
          ttnn-accuracy report --categories unary,unary_bw,binary,binary_bw,ternary,ternary_bw

      - name: Publish
        # The other architecture may have pushed while this job measured, so rebase onto
        # it rather than racing; nothing to commit is a success, not a failure.
        run: |
          git add -A reports/ report_index.json stats/
          git diff --cached --quiet && { echo "no change to publish"; exit 0; }
          git -c user.name=nightly-report -c user.email=nightly@users.noreply.github.com \
            commit -m "data(${{ matrix.arch }}): nightly report at ${{ needs.pin.outputs.sha }}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "push race, retrying ($attempt)"; sleep $((attempt * 10))
          done
          exit 1
