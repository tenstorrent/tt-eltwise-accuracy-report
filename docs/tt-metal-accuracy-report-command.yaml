# Belongs in tt-metal, as `.github/workflows/accuracy-report-command.yaml`. It lives here
# because it only works paired with `accuracy-command.yml`, and the two drift apart if kept
# in separate repositories. What it does and what it needs: docs/pr-command.md.

name: accuracy-report-command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  # A pull request's conversation comment is an issue comment, so both are needed.
  issues: write
  pull-requests: write

env:
  ORACLE: tenstorrent/tt-eltwise-accuracy-report

jobs:
  dispatch:
    # A plain issue has no diff to select ops from, and no head to measure.
    if: github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/accuracy-report')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    # One in flight per pull request. Every `issue_comment` reports `github.ref` as the
    # default branch, so the default group would collapse every PR into a single slot.
    concurrency:
      group: accuracy-report-command-${{ github.event.issue.number }}
    steps:
      # The authorization control, not a formality: a run occupies silicon the whole org
      # shares. Write mirrors `/test`, and grants nothing a person could not already do by
      # dispatching the workflow by hand.
      - name: Refuse anyone without write access
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          level=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
            --jq .permission 2>/dev/null || echo none)
          case "$level" in
            admin|maintain|write) echo "$ACTOR may run this" ;;
            *) echo "::error::$ACTOR has $level access; /accuracy-report needs write"; exit 1 ;;
          esac

      - name: Start the run
        id: start
        env:
          # Scoped to Actions on ORACLE alone. Nothing in this file can reach tt-metal with
          # it, which is the point: the trust runs one way.
          GH_TOKEN: ${{ secrets.ACCURACY_REPORT_DISPATCH_TOKEN }}
          PR: ${{ github.event.issue.number }}
          # Anyone may comment, so this is attacker-controlled. Through the environment and
          # matched against a fixed shape; `${{ }}` here would be a shell injection.
          BODY: ${{ github.event.comment.body }}
        run: |
          [[ $BODY =~ ops=([A-Za-z0-9_,]+) ]] && ops=${BASH_REMATCH[1]} || ops=
          workflow="$GITHUB_SERVER_URL/$ORACLE/actions/workflows/accuracy-command.yml"

          if ! gh workflow run accuracy-command.yml --repo "$ORACLE" \
                 -f pr="$PR" ${ops:+-f ops="$ops"}
          then
            # A missing secret is the likeliest failure and the least visible one. Report it
            # on the pull request rather than only in a log nobody opens.
            { echo "started=false"; echo "url=$workflow"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"

          # `gh workflow run` returns no id, and the newest run may be someone else's. The
          # called workflow's `run-name` carries this PR number, so the name identifies it.
          # On `name`, not `displayTitle`: older `gh` lacks that field and errors the query.
          for _ in 1 2 3 4 5 6; do
            sleep 5
            id=$(gh run list --repo "$ORACLE" --workflow accuracy-command.yml \
              --limit 20 --json databaseId,createdAt,name \
              --jq "[.[] | select(.name == \"accuracy-report for tt-metal#$PR\")]
                    | sort_by(.createdAt) | last | .databaseId // empty" 2>/dev/null || true)
            [ -z "$id" ] || break
          done
          # Still running even if it cannot be pinpointed, so link the workflow. Failing here
          # would report a problem that does not exist.
          if [ -n "$id" ]
          then echo "url=$GITHUB_SERVER_URL/$ORACLE/actions/runs/$id" >> "$GITHUB_OUTPUT"
          else echo "url=$workflow" >> "$GITHUB_OUTPUT"
          fi

      - name: Say it started
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          URL: ${{ steps.start.outputs.url }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          if [ "$STARTED" = true ]
          then body="Measuring the eltwise ops this change can affect — [run]($URL). Informational: it does not gate this pull request."
          else body="\`/accuracy-report\` could not start a run: \`ACCURACY_REPORT_DISPATCH_TOKEN\` is missing or cannot reach [$ORACLE]($URL)."
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
